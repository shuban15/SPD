<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPD - Student Vault</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand span {
      background: var(--accent-color);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      flex: 1;
      font-size: 0.9rem;
    }

    .btn:hover {
      background-color: var(--border-color);
    }

    .drop-zone {
      border: 2px dashed var(--accent-color);
      background: rgba(59, 130, 246, 0.05);
      border-radius: 12px;
      padding: 30px 16px;
      text-align: center;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .history-list {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .history-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    @media (min-width: 640px) {
      body { padding: 24px; }
      .brand h1 { font-size: 1.6rem; }
      .nav-buttons { width: auto; }
      .btn { flex: initial; }
      .drop-zone { padding: 40px; }
      .history-item { flex-direction: row; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <h1>Semester Project Deck</h1>
        <span>SPD</span>
      </div>
      <div class="nav-buttons">
        <a href="index.html" class="btn">Back to Roster</a>
      </div>
    </div>

    <h2 id="vaultTitle" style="margin-bottom: 5px; font-size: 1.4rem;"></h2>
    <p id="vaultRoll" style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;"></p>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <p style="font-size: 1rem; font-weight: 600; margin-bottom: 6px;">Tap or Drag & Drop to Upload File</p>
      <p style="font-size: 0.8rem; color: var(--text-muted);">PDF, ZIP, DOCX supported</p>
      <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
    </div>

    <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Submission History</h3>
    <div id="uploadHistory" class="history-list"></div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
