<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPD - Professor Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 16px; }
    .container { max-width: 1200px; margin: 0 auto; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;
      gap: 12px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
    .brand span { background: var(--accent-color); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

    .btn {
      background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
      padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s;
      text-decoration: none; display: inline-block; text-align: center; font-size: 0.9rem;
    }
    .btn:hover { background-color: var(--border-color); }
    .btn-primary { background-color: var(--accent-color); border-color: var(--accent-color); }

    .action-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .prof-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

    .sidebar {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; max-height: 350px; overflow-y: auto;
    }
    .sidebar-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .sidebar-item.active { background: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--accent-color); }

    .preview-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
    .history-list { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .history-item { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border-color); }

    /* Login Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 24px; width: 100%; max-width: 360px; text-align: center;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 16px 0; background: var(--bg-color);
      border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 1rem; text-align: center;
    }

    @media (min-width: 768px) {
      body { padding: 24px; }
      .action-bar { flex-direction: row; justify-content: space-between; align-items: center; }
      .prof-grid { grid-template-columns: 320px 1fr; }
      .sidebar { max-height: 70vh; }
      .history-item { flex-direction: row; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- Password Modal for Mobile & Desktop -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-bottom: 8px;">Professor Portal</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Enter master password to access student reports</p>
      <input type="password" id="profPassInput" placeholder="Enter Password">
      <button class="btn btn-primary" id="profLoginBtn" style="width: 100%;">Login</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="brand">
        <h1>Semester Project Deck</h1>
        <span>SPD</span>
      </div>
      <div class="nav-buttons">
        <a href="index.html" class="btn">Student View</a>
      </div>
    </div>

    <div class="action-bar">
      <h2>Professor Dashboard</h2>
      <button class="btn btn-primary" onclick="downloadClassZip()">📦 Download Class ZIP</button>
    </div>

    <div class="prof-grid">
      <div id="profSidebar" class="sidebar"></div>
      <div id="profPreview" class="preview-panel">
        <p style="color: var(--text-muted);">Select a student from the list to inspect files.</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/professor.js"></script>
</body>
</html>
