<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Project Deck - Student Roster</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand span {
      background: var(--accent-color);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      flex: 1;
      font-size: 0.9rem;
    }

    .btn:hover {
      background-color: var(--border-color);
    }

    .btn-primary {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .search-box {
      width: 100%;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 20px;
      font-size: 1rem;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      border-color: var(--accent-color);
    }

    .card-info .name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .card-info .roll {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Tablet & Desktop Layouts */
    @media (min-width: 640px) {
      body { padding: 24px; }
      .brand h1 { font-size: 1.6rem; }
      .nav-buttons { width: auto; }
      .btn { flex: initial; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <h1>Semester Project Deck</h1>
        <span>SPD</span>
      </div>
      <div class="nav-buttons">
        <a href="index.html" class="btn">Student View</a>
        <a href="professor.html" class="btn btn-primary">Professor Portal</a>
      </div>
    </div>

    <input type="text" id="studentSearch" class="search-box" placeholder="Search by name or roll number..." oninput="filterStudents()">
    <div id="studentGrid" class="grid"></div>
  </div>

<script type="module">
  import { studentData, getAllUploads } from "./js/firebase.js";

  const grid = document.getElementById('studentGrid');

  // 1. Immediate local render (Guarantees names always show up instantly)
  function renderInitialRoster(list = studentData) {
    grid.innerHTML = list.map(s => `
      <a class="card" href="student.html?rollNo=${s.rollNo}" id="card-${s.rollNo}">
        <div class="card-info">
          <div class="name">${s.name}</div>
          <div class="roll">${s.rollNo}</div>
        </div>
        <span class="upload-badge" style="display:none; color:var(--success); font-size:0.8rem; font-weight:600;">Uploaded</span>
      </a>
    `).join('');
  }

  // 2. Fetch Firestore uploads in background to turn on badges
  async function syncUploadBadges() {
    try {
      const uploads = await getAllUploads();
      studentData.forEach(s => {
        if (uploads[s.rollNo] && uploads[s.rollNo].length > 0) {
          const badge = document.querySelector(`#card-${s.rollNo} .upload-badge`);
          if (badge) badge.style.display = 'inline';
        }
      });
    } catch (err) {
      console.warn("Could not sync Firestore badges, showing roster anyway:", err);
    }
  }

  // Filter search
  window.filterStudents = function() {
    const q = document.getElementById('studentSearch').value.toLowerCase();
    const filtered = studentData.filter(s => s.name.toLowerCase().includes(q) || s.rollNo.includes(q));
    renderInitialRoster(filtered);
    syncUploadBadges();
  };

  renderInitialRoster();
  syncUploadBadges();
</script>
</body>
</html>
